name: discourse
icon: discourse
docs: https://wodby.com/docs/2.0/stacks/catalog/discourse/
title: Discourse
# The main stack of the Discourse variants: the catalog shows this next to the
# link to it on the variants' pages.
variantDescription: >-
  Choose this when the plugins that ship with Discourse are enough: it runs the
  prebuilt Discourse image, with no Git repository to maintain and no builds.

services:
- name: discourse
  title: Discourse
  service: discourse
  required: true
  main: true
  links:
  - name: db
    service: postgres
  - name: redis
    service: redis
  - name: sendmail
    service: opensmtpd
  volumes:
  - name: data
    size: 20
  workloads:
  - name: main
    containers:
    - name: discourse
      resources:
        request:
          cpu: 500
          memory: 2048
        limit:
          cpu: 2000
          memory: 4096

- name: postgres
  title: PostgreSQL
  service: postgres
  required: true
  env:
  - name: POSTGRES_DB_EXTENSIONS
    value: hstore,pg_trgm,unaccent,vector
  volumes:
  - name: data
    size: 20

- name: redis
  title: Redis
  service: redis
  required: true
  env:
  - name: REDIS_MAXMEMORY
    value: 512m
  - name: REDIS_MAXMEMORY_POLICY
    value: noeviction
  - name: REDIS_SAVE_TO_DISK
    value: '1'
  volumes:
  - name: data
    size: 5

- name: opensmtpd
  title: OpenSMTPD
  service: opensmtpd
  required: true
  volumes:
  - name: spool
    size: 1
